name: Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python3 -m compileall -q server.py support scripts
      - name: Page JavaScript
        run: python3 tests/check_page_js.py
      - name: Tests
        run: python3 -m unittest discover -s tests -v
